name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The three desktop targets are a hard product requirement (CLAUDE.md,
  # 方案建议.md §10), so they are checked on every push from the first commit
  # rather than added once the engine is "done" — by then the platform-specific
  # damage is already baked in.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `macos-26` rather than `macos-latest`, and only for the macOS entry:
        # the golden suite derives its baseline filename from the *runner's*
        # `std::env::consts::ARCH`, and `macos-latest` is a floating label that
        # GitHub has already moved across macOS 13/14/15/26. Its Intel and Arm64
        # images are separate labels (`macos-26-intel` / `macos-26`), so a float
        # onto an x86_64 image would silently start looking for
        # `macos-x86_64.png` and fail the macOS leg for a reason that has nothing
        # to do with the code. Pinning makes that a deliberate, visible update.
        # Per GitHub's runner-images table, `macos-26` is the macOS 26 Arm64 image
        # — the one `macos-aarch64.png` is named for. `ubuntu-*`/`windows-*` are
        # left floating: nothing in the suite keys off their arch today.
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # winit needs xkbcommon/wayland headers on Linux; macOS and Windows need
      # nothing beyond the toolchain.
      - name: install Linux windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev

      # Matches `channel` in rust-toolchain.toml; keep the two in step.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace

  # The day-one guard from 方案建议.md §10.6: the semantic kernel must not grow a
  # dependency on a platform that does not exist in a browser. Checking it on
  # every push is much cheaper than discovering in Phase 2 that some convenience
  # import dragged `std::fs` into the middle of the model.
  wasm-kernel:
    name: wasm32 semantic kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Deliberately excludes rustim-app (winit/softbuffer have no wasm32 build
      # here), rustim-text and rustim-export (both do I/O by nature).
      - run: >
          cargo build --target wasm32-unknown-unknown
          -p rustim-math -p rustim-color -p rustim-mobject
          -p rustim-anim -p rustim-scene -p rustim-render

      # The browser host, and the scene it shares with the desktop binary. The
      # second line is the only build in this repository where a Typst crate
      # reaches wasm32 on purpose: `formula` is an opt-in feature of
      # `rustim-web` alone, which is what keeps Typst out of the kernel build
      # above and out of the plain page's download (`tools/build-web.sh`).
      - name: the browser host builds, with and without Typst
        run: |
          cargo build --target wasm32-unknown-unknown -p rustim-scenes -p rustim-web
          cargo build --target wasm32-unknown-unknown -p rustim-web --features formula

      # What this job cannot check: the canvas and the accessibility tree. Those
      # need a real Chrome, so they live in `tools/web-check.mjs` (zero npm
      # dependencies, Node 24's own WebSocket) and are run by hand. The GitHub
      # runner images do ship Chrome, but pinning a check to an image's browser
      # version without ever having run it there would be a claim, not a test —
      # what is checked in CI is that both artifacts *compile*.

      # The half of the guard a build cannot make. `accesskit` is platform
      # agnostic enough to compile to wasm32, so a stray dependency would not
      # fail the build above — it would silently put a desktop accessibility
      # binding inside the kernel, which is meant to reach the browser through
      # DOM/ARIA instead. Asserted both ways round, so the check cannot pass
      # vacuously if the dependency is renamed away.
      - name: accesskit stays in the application layer
        run: |
          if cargo tree -p rustim-scene -e no-dev | grep -q accesskit; then
            echo "::error::accesskit reached the semantic kernel; it belongs in rustim-app only"
            cargo tree -p rustim-scene -e no-dev | grep accesskit
            exit 1
          fi
          if ! cargo tree -p rustim-app -e normal | grep -q accesskit; then
            echo "::error::rustim-app no longer depends on accesskit; the check above is vacuous"
            exit 1
          fi

  # Typst, for formulas, arrives carrying a whole second shaping stack: a frozen
  # `rustybuzz` / `ttf-parser` pair and its own font book. That is acceptable
  # only because it is confined to `rustim-text`, which is deliberately *not* one
  # of the six kernel crates — if it spread, the frozen parser and a second
  # shaping engine would end up in the wasm build and in the rasteriser.
  #
  # A `cargo tree` guard rather than a build one, for the same reason as the
  # accesskit pair above: Typst compiles to wasm32 quite happily, so nothing
  # about the kernel build would fail if it leaked inward.
  typst-subtree:
    name: Typst stays inside rustim-text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The six wasm kernel crates, each of which must reach Typst never.
      - name: no Typst crate reaches the semantic kernel
        run: |
          failed=0
          for p in rustim-math rustim-color rustim-mobject \
                   rustim-anim rustim-scene rustim-render; do
            if cargo tree -p "$p" -e normal --prefix none | grep -qE '^(typst(-| )|rustybuzz |ttf-parser )'; then
              echo "::error::$p depends on Typst or on Typst's frozen shaping stack"
              cargo tree -p "$p" -e normal --prefix none | grep -E '^(typst(-| )|rustybuzz |ttf-parser )'
              failed=1
            fi
          done
          # ...and the check must not be vacuous: if `rustim-text` stopped
          # depending on Typst, every loop above would pass by finding nothing.
          if ! cargo tree -p rustim-text -e normal --prefix none | grep -q '^typst v0.15'; then
            echo "::error::rustim-text no longer depends on Typst; the check above proves nothing"
            exit 1
          fi
          exit $failed

      - name: the renderer never shapes
        run: |
          if cargo tree -p rustim-render -e normal --prefix none | grep -q rustim-text; then
            echo "::error::rustim-render depends on rustim-text; only kurbo geometry may cross"
            exit 1
          fi
          if ! cargo tree -p rustim-text -e normal --prefix none | grep -q '^rustybuzz '; then
            echo "::error::Typst's shaping stack left rustim-text; the check above is vacuous"
            exit 1
          fi

      # `skrifa` reads glyph outlines and is pinned to one version used twice:
      # by `parley`/`glifo` (shaping, in the renderer) and by `rustim-text`
      # (formulas). Exactly two versions must be in the whole application tree,
      # and the older one must stay where it came from — Typst's own image
      # subtree (`hayro-interpret`), which is harmless but *looks* like a
      # mistake, which is why this asserts the pair by name.
      - name: skrifa is one version, plus Typst's own
        run: |
          got=$(cargo tree -p rustim-app -e normal --prefix none | grep -oE '^skrifa v[0-9.]+' | sort -u)
          want=$'skrifa v0.42.1\nskrifa v0.44.0'
          if [ "$got" != "$want" ]; then
            echo "::error::the skrifa versions in the tree changed"
            echo "expected:"; echo "$want"
            echo "got:";      echo "$got"
            echo "if Typst moved off 0.42.1, update the note in rustim-text/Cargo.toml and docs/history.md"
            exit 1
          fi

  # Renders every reference scene through the real binary and compares it to a
  # checked-in baseline, pixel by pixel.
  #
  # Baselines are per platform *and per architecture*, because vello_cpu
  # rasterises in f32 and NEON and SSE/AVX do not round identically (方案建议.md
  # §10.2(3)). So this job needs a matrix rather than one shared image, and it
  # fails — loudly, never by skipping — on a platform whose baseline has not
  # been committed yet. The render is uploaded as an artifact so that bootstrap
  # is "download, review, commit", not "re-run and hope the log says enough".
  goldens:
    name: goldens (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # `macos-26` rather than `macos-latest`, and only for the macOS entry:
        # the golden suite derives its baseline filename from the *runner's*
        # `std::env::consts::ARCH`, and `macos-latest` is a floating label that
        # GitHub has already moved across macOS 13/14/15/26. Its Intel and Arm64
        # images are separate labels (`macos-26-intel` / `macos-26`), so a float
        # onto an x86_64 image would silently start looking for
        # `macos-x86_64.png` and fail the macOS leg for a reason that has nothing
        # to do with the code. Pinning makes that a deliberate, visible update.
        # Per GitHub's runner-images table, `macos-26` is the macOS 26 Arm64 image
        # — the one `macos-aarch64.png` is named for. `ubuntu-*`/`windows-*` are
        # left floating: nothing in the suite keys off their arch today.
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The test runs the real binary, so it needs the same windowing headers as
      # the `test` job even though this path opens no window.
      - name: install Linux windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: golden images
        run: cargo test -p rustim-app --test goldens

      # Only on failure, and `ignore` so a platform with no artifacts yet does
      # not turn a clear "missing baseline" into a second, confusing error.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-renders-${{ matrix.os }}
          path: target/golden-artifacts/
          if-no-files-found: ignore
          retention-days: 30
