[package]
name = "rustim-scene"
description = "Scene graph, stable ids, the serde command layer and the a11y mapping."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustim-math.workspace = true
rustim-color.workspace = true
rustim-render.workspace = true
rustim-mobject.workspace = true
rustim-anim.workspace = true
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: see the workspace manifest — the a11y snapshot round-trip
# test compares whole trees for equality, and a one-ULP parse difference would
# fail it (and, with a host in the loop, would make a logged document differ from
# the one it re-serialised).
serde_json = { version = "1", features = ["float_roundtrip"] }
