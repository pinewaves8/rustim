[package]
name = "rustim-anim"
description = "Rate functions, the Animation trait, and timeline evaluation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustim-math.workspace = true
rustim-mobject.workspace = true
# `Animate`'s colour channel is a colour, not a component array: `StyleProperty`
# hands `Srgb` straight to `Style::stroke`, and `Transform`'s tests already need
# the palette. It is a kernel crate with no dependencies of its own, so this
# adds nothing to the wasm surface.
rustim-color.workspace = true
