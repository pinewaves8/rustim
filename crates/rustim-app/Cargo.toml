[package]
name = "rustim-app"
description = "The winit event loop, input routing, and the runnable binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rustim-math.workspace = true
rustim-color.workspace = true
rustim-mobject.workspace = true
rustim-anim.workspace = true
rustim-render.workspace = true
rustim-export.workspace = true
rustim-scene.workspace = true
# Shared with the browser build: the app's `pythagorean` scene is this crate's
# `Pythagorean`, so the desktop golden and the canvas pixels are one construction.
rustim-scenes.workspace = true
# Text shaping. Only this crate links it: `rustim-render` must not (it would drag
# parley into the `wasm32-unknown-unknown` kernel build), and `rustim-text` must
# not link a renderer. The app is where the two sides meet, which is why it is
# also the only place that converts a shaped run into a `DrawOp::GlyphRun`.
rustim-text.workspace = true
winit.workspace = true
softbuffer.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
# The one crate where this is a real dependency rather than a test-only one. It
# is not a `wasm-kernel` crate, so the root `Cargo.toml` rule against letting it
# reach `wasm32-unknown-unknown` does not apply — and `--inspect` has to emit
# JSON, because on a machine with no screen reader and no AT-SPI session bus a
# file is the only way to see what the accessibility layer would say.
serde_json.workspace = true

[dev-dependencies]
# It is the *consumer* of an AccessKit update — it validates that an incremental
# update is well formed against the tree a platform would be holding, which is
# exactly the property "send only what changed" can break and which no assertion
# over our own `TreeUpdate` can check. It is already in the Linux graph through
# `accesskit_unix` (the AT-SPI backend builds on it), so this line adds no crate;
# it only puts the same implementation in scope for our tests, so the suite
# validates against the code a platform backend actually runs.
accesskit_consumer = "0.39"
